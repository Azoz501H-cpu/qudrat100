<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B2A4A"><title>قدرات100</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#132238;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial}header{background:#0B2A4A;color:#fff;padding:18px;position:sticky;top:0}.top{display:flex;justify-content:space-between;max-width:720px;margin:auto}.brand{font-size:23px;font-weight:900}.acct{border:0;background:#ffffff22;color:#fff;border-radius:13px;padding:8px 12px;font-size:19px}.wrap{max-width:720px;margin:auto;padding:16px}.hero,.lesson{background:#fff;border-radius:20px;padding:18px;margin-bottom:13px;box-shadow:0 5px 18px #0b2a4a12}.muted{color:#687486}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:0;border-radius:20px;padding:18px;text-align:right;min-height:145px;color:#132238;font:inherit;box-shadow:0 5px 18px #0b2a4a12}.card b{font-size:20px;display:block;margin:8px 0}.foundation{background:#e8f2ff}.training{background:#e9f8ef}.plan{background:#fff5cf;width:100%;margin-top:12px;min-height:120px}.icon{font-size:31px}.view{display:none}.active{display:block}.back,.primary{border:0;border-radius:13px;padding:11px 14px;font-weight:800}.back{background:#e9edf1;color:#0B2A4A;margin-bottom:13px}.primary{background:#0B2A4A;color:#fff}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:13px}.tabs button{border:0;border-radius:12px;padding:10px 13px;font-weight:800;white-space:nowrap}.tabs .on{background:#0B2A4A;color:#fff}.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.days button{background:#fff;border:1px solid #ddd;border-radius:13px;padding:12px 5px;font-weight:800}.days .sel{background:#0B2A4A;color:#fff}.row{background:#fff;border-radius:15px;padding:14px;margin:8px 0;display:flex;justify-content:space-between}.pill{background:#edf3f8;border-radius:30px;padding:5px 9px;font-size:13px}@media(max-width:420px){.wrap{padding:13px}.card{padding:14px;min-height:135px}}
</style></head><body><header><div class="top"><div class="brand">قدرات100</div><button class="acct" onclick="alert('الحساب والإدارة سيتم ربطهما بالحساب لاحقًا')">👤</button></div></header><main class="wrap">
<section id="home" class="view active"><div class="hero"><h2>وش تبي تبدأ فيه؟</h2><p class="muted">اختر التأسيس أو التدريب، وبعدها الكمي أو اللفظي.</p></div><div class="grid"><button class="card foundation" onclick="openMode('تأسيس')"><span class="icon">📘</span><b>تأسيس</b><span>ابدأ من الصفر وافهم القواعد</span></button><button class="card training" onclick="openMode('تدريب')"><span class="icon">🎯</span><b>تدريب</b><span>أسئلة وتطبيق وتحليل أخطاء</span></button></div><button class="card plan" onclick="show('plans')"><span class="icon">🗓️</span><b>خطتي الدراسية</b><span>الأيام، المهام، والإنجاز</span></button></section>
<section id="mode" class="view"><button class="back" onclick="show('home')">الرئيسية</button><div class="hero"><h2 id="modeTitle"></h2><p class="muted">اختر القسم.</p></div><div class="grid"><button class="card foundation" onclick="enter('كمي')"><span class="icon">🔢</span><b>الكمي</b><span>الأعداد والنسب والهندسة</span></button><button class="card foundation" onclick="enter('لفظي')"><span class="icon">📝</span><b>اللفظي</b><span>التناظر والسياق والاستيعاب</span></button></div></section>
<section id="section" class="view"><button class="back" onclick="exitSession()">إنهاء الجلسة</button><div class="hero"><h2 id="sectionTitle"></h2><p class="muted">تنقل بين الدروس وشاهد خطتك بدون الخروج من القسم.</p></div><div class="tabs"><button class="on" onclick="tab(this,'lessons')">📚 الدروس</button><button onclick="tab(this,'insidePlan')">🗓️ الخطة</button><button onclick="tab(this,'progress')">📊 تقدمي</button></div><div id="lessons"></div><div id="insidePlan" style="display:none"></div><div id="progress" style="display:none" class="hero"><h3>تقدمي</h3><p>يتم حفظ تقدمك على الجهاز.</p></div></section>
<section id="plans" class="view"><button class="back" onclick="show('home')">الرئيسية</button><div class="hero"><h2>🗓️ خطتي الدراسية</h2><p class="muted">اختر مدة الخطة.</p><div class="days"><button onclick="plan(this,7)">7 أيام</button><button onclick="plan(this,14)">14 يوم</button><button onclick="plan(this,30)">30 يوم</button><button onclick="plan(this,45)">45 يوم</button><button onclick="plan(this,60)">60 يوم</button><button onclick="custom()">مخصصة</button></div></div><div id="planOut"></div></section>
</main><script>
let mode='',sec='';const q=['النسبة والتناسب','النسبة المئوية','المتوسط الحسابي','المثلث والزوايا','المسافة والسرعة والزمن'];const v=['التناظر اللفظي','إكمال الجمل','الخطأ السياقي','الارتباط والاختلاف','استيعاب المقروء'];
function show(x){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById(x).classList.add('active');scrollTo(0,0)}
function openMode(x){mode=x;modeTitle.textContent=x;show('mode')}function enter(x){sec=x;sectionTitle.textContent=mode+' '+sec;render();inside();show('section')}
function exitSession(){if(confirm('متأكد أنك تبي تنهي الجلسة؟ تقدمك محفوظ.'))show('home')}
function tab(b,x){document.querySelectorAll('.tabs button').forEach(e=>e.classList.remove('on'));b.classList.add('on');['lessons','insidePlan','progress'].forEach(i=>document.getElementById(i).style.display=i==x?'block':'none')}
function render(){let a=sec==='كمي'?q:v;lessons.innerHTML=a.map((x,i)=>`<div class="lesson"><span class="pill">الدرس ${i+1}</span><h3>${x}</h3><p class="muted">${mode==='تأسيس'?'فيديو + صوت + قراءة + 3 أسئلة':'تدريب متنوع + تحليل الأخطاء'}</p><button class="primary" onclick="alert('الدرس: ${x} — سيتم ربط المحتوى الكامل هنا')">ابدأ</button></div>`).join('')}
function inside(){let d=localStorage.planDays||30;insidePlan.innerHTML=`<div class="hero"><h3>خطتك الحالية: ${d} يوم</h3><p>تقدر تشوف الخطة أثناء الدروس.</p><button class="primary" onclick="show('plans')">عرض الخطة كاملة</button></div>`}
function plan(b,d){document.querySelectorAll('.days button').forEach(e=>e.classList.remove('sel'));b.classList.add('sel');makePlan(d)}
function custom(){let d=parseInt(prompt('كم يوم؟'));if(d>0)makePlan(d)}
function makePlan(d){localStorage.planDays=d;let s='';for(let i=1;i<=Math.min(d,14);i++){let p=i<=Math.ceil(d*.4)?'تأسيس كمي + لفظي':i<=Math.ceil(d*.8)?'تدريب كمي + لفظي':'اختبار ومراجعة';s+=`<div class="row"><div><b>اليوم ${i}</b><br><span class="muted">${p}</span></div><span>○</span></div>`}planOut.innerHTML=`<div class="hero"><h3>خطة ${d} يوم</h3><p class="muted">تبدأ بالتأسيس ثم التدريب ثم الاختبارات.</p></div>`+s;inside()}
if(localStorage.planDays)makePlan(+localStorage.planDays);
</script></body></html>
